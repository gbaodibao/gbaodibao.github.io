<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .gallery img {
      max-width: 100%;     /* Đảm bảo không tràn màn hình */
      width: auto;         /* Giữ nguyên kích thước ngang theo tỷ lệ */
      height: auto;        /* Tự động chỉnh chiều cao theo tỷ lệ gốc, không xén */
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: block;
    }
  </style>
</head>
<body>


  <div class="gallery">
   
    <img src="h.jpg" alt="Ảnh 1">



  </div>

</body>
</html>
